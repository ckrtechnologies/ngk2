<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A35"/>
      <stop offset="100%" stop-color="#B90014"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E10000" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Rounded Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Automotive Red Shield Core -->
  <path d="M32 8 L51 16 V32 C51 44.5 42.8 52.8 32 56 C21.2 52.8 13 44.5 13 32 V16 Z" fill="url(#redGrad)" filter="url(#glow)"/>
  
  <!-- Inner Shield Highlight Border -->
  <path d="M32 11 L48 18 V32 C48 42.5 41 49.5 32 52.5 C23 49.5 16 42.5 16 32 V18 Z" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Stylized Automotive Symbol: Spark & Damper Fusion -->
  <!-- Top Terminal -->
  <rect x="29.5" y="16" width="5" height="3.5" rx="1" fill="url(#metalGrad)"/>
  <!-- Insulator Ribs -->
  <rect x="28" y="20.5" width="8" height="2.8" rx="1" fill="#FFFFFF"/>
  <rect x="27.5" y="24.5" width="9" height="2.8" rx="1" fill="#FFFFFF"/>
  <!-- Hex Nut / Housing -->
  <polygon points="26,29 38,29 36.5,35 27.5,35" fill="url(#metalGrad)"/>
  <!-- Central Shaft -->
  <rect x="30.5" y="35" width="3" height="6" fill="#FFFFFF"/>
  <!-- Suspension Coil / Arc Spring -->
  <path d="M24 43 C24 40.5 40 40.5 40 43 C40 45.5 24 45.5 24 48 C24 50.5 40 50.5 40 50.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>